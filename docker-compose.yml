services:
  backend:
    build:
      context: .
      dockerfile: netpredict/Dockerfile
    container_name: attack-forecast-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attack-forecast-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend